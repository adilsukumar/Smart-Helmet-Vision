<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="310" viewBox="0 0 1120 310" role="img" aria-labelledby="t d"><title id="t">Python rule-engine events: NO_HELMET, TRIPLE_RIDING and RED_LIGHT_CROSSING. Stable observations, rider-to-bike association and calibrated signal geometry are required.</title><desc id="d">Python rule-engine events: NO_HELMET, TRIPLE_RIDING and RED_LIGHT_CROSSING. Stable observations, rider-to-bike association and calibrated signal geometry are required. Concept artwork, not a detector screenshot, confidence measurement or evidence of a real violation.</desc><defs><linearGradient id="foil"><stop stop-color="#F8F8F3"/><stop offset=".55" stop-color="#BCFCF6"/><stop offset="1" stop-color="#A783F7"/></linearGradient></defs><style>@keyframes focus{50%{opacity:.35}}@keyframes visor{50%{stroke:#FF4081}}@keyframes float{50%{transform:translateY(-5px)}}.focus{animation:focus 5s ease-in-out infinite}.visor{animation:visor 8s ease-in-out infinite}.float{animation:float 9s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.focus,.visor,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="340" height="280" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 34) scale(0.9090909090909091)"><path d="M4 29V24a18 18 0 0 1 36 0v7H26l-6 9H8V29zM25 16h15M26 16v15M9 33h10" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="61" font-family="Bahnschrift, Arial, sans-serif" font-size="18" fill="#F3D962" font-weight="600" >HELMET USE</text><text x="46" y="115" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#BCFCF6" font-weight="400" >Wait for a consistent</text><text x="46" y="149" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#BCFCF6" font-weight="400" >helmet or no-helmet</text><text x="46" y="183" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#BCFCF6" font-weight="400" >result.</text><text x="46" y="267" font-family="Bahnschrift, Arial, sans-serif" font-size="16" fill="#A783F7" font-weight="600" >NO_HELMET</text><rect x="389" y="12" width="340" height="280" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(409 34) scale(0.9090909090909091)"><path d="M9 5a5 5 0 1 0 0 10a5 5 0 1 0 0-10M23 5a5 5 0 1 0 0 10a5 5 0 1 0 0-10M37 5a5 5 0 1 0 0 10a5 5 0 1 0 0-10M3 36V22q6-8 12 0v14M17 36V22q6-8 12 0v14M31 36V22q6-8 12 0v14" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="466" y="61" font-family="Bahnschrift, Arial, sans-serif" font-size="18" fill="#F3D962" font-weight="600" >TRIPLE RIDING</text><text x="411" y="115" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#BCFCF6" font-weight="400" >Associate riders with a</text><text x="411" y="149" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#BCFCF6" font-weight="400" >tracked motorcycle.</text><text x="411" y="267" font-family="Bahnschrift, Arial, sans-serif" font-size="16" fill="#A783F7" font-weight="600" >TRIPLE_RIDING</text><rect x="754" y="12" width="340" height="280" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(774 34) scale(0.9090909090909091)"><path d="M13 3h19v32H13zM22 35v8M22 8a3 3 0 1 0 0 6a3 3 0 1 0 0-6M22 18h.1M22 27h.1" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="831" y="61" font-family="Bahnschrift, Arial, sans-serif" font-size="18" fill="#F3D962" font-weight="600" >RED-LIGHT CROSSING</text><text x="776" y="115" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#BCFCF6" font-weight="400" >Check a calibrated stop</text><text x="776" y="149" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#BCFCF6" font-weight="400" >line during a red</text><text x="776" y="183" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#BCFCF6" font-weight="400" >signal.</text><text x="776" y="267" font-family="Bahnschrift, Arial, sans-serif" font-size="16" fill="#A783F7" font-weight="600" >RED_LIGHT_CROSSING</text></svg>