<svg xmlns="http://www.w3.org/2000/svg" width="640" height="315" viewBox="0 0 640 315" role="img" aria-labelledby="t d"><title id="t">The traffic model loads first, followed by the helmet model. Wait for Models ready before selecting or playing a video. Inference runs in a browser worker.</title><desc id="d">The traffic model loads first, followed by the helmet model. Wait for Models ready before selecting or playing a video. Inference runs in a browser worker. Concept artwork, not a detector screenshot, confidence measurement or evidence of a real violation.</desc><defs><linearGradient id="foil"><stop stop-color="#F8F8F3"/><stop offset=".55" stop-color="#BCFCF6"/><stop offset="1" stop-color="#A783F7"/></linearGradient></defs><style>@keyframes focus{50%{opacity:.35}}@keyframes visor{50%{stroke:#FF4081}}@keyframes float{50%{transform:translateY(-5px)}}.focus{animation:focus 5s ease-in-out infinite}.visor{animation:visor 8s ease-in-out infinite}.float{animation:float 9s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.focus,.visor,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="592" height="280" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 36) scale(1.0)"><path d="M22 3l18 10v19L22 42 4 32V13zM4 13l18 10 18-10M22 23v19" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="112" y="74" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#F8F8F3" font-weight="600" >TWO MODELS. ONE AT A TIME.</text><text x="46" y="136" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#F3D962" font-weight="600" >1 / TRAFFIC MODEL</text><text x="46" y="184" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#BCFCF6" font-weight="600" >2 / HELMET MODEL</text><text x="46" y="238" font-family="Bahnschrift, Arial, sans-serif" font-size="24" fill="#A783F7" font-weight="400" >Wait for the green “Models ready” message.</text></svg>