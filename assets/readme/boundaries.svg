<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="t d"><title id="t">Selected videos stay on the device. Signal-crossing rules need camera calibration. Predictions require human review; this is not an automatic traffic-enforcement system.</title><desc id="d">Selected videos stay on the device. Signal-crossing rules need camera calibration. Predictions require human review; this is not an automatic traffic-enforcement system. Concept artwork, not a detector screenshot, confidence measurement or evidence of a real violation.</desc><defs><linearGradient id="foil"><stop stop-color="#F8F8F3"/><stop offset=".55" stop-color="#BCFCF6"/><stop offset="1" stop-color="#A783F7"/></linearGradient></defs><style>@keyframes focus{50%{opacity:.35}}@keyframes visor{50%{stroke:#FF4081}}@keyframes float{50%{transform:translateY(-5px)}}.focus{animation:focus 5s ease-in-out infinite}.visor{animation:visor 8s ease-in-out infinite}.float{animation:float 9s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.focus,.visor,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="340" height="290" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 35) scale(0.9090909090909091)"><path d="M4 8h28v31H4zM32 17l10-7v28l-10-7M13 17l10 7-10 7z" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="62" font-family="Bahnschrift, Arial, sans-serif" font-size="18" fill="#F3D962" font-weight="600" >LOCAL VIDEO</text><text x="46" y="120" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F8F8F3" font-weight="400" >The selected file stays</text><text x="46" y="154" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F8F8F3" font-weight="400" >on your device and is</text><text x="46" y="188" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F8F8F3" font-weight="400" >not uploaded.</text><rect x="389" y="12" width="340" height="290" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(409 35) scale(0.9090909090909091)"><path d="M13 3h19v32H13zM22 35v8M22 8a3 3 0 1 0 0 6a3 3 0 1 0 0-6M22 18h.1M22 27h.1" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="466" y="62" font-family="Bahnschrift, Arial, sans-serif" font-size="18" fill="#F3D962" font-weight="600" >CAMERA CALIBRATION</text><text x="411" y="120" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F8F8F3" font-weight="400" >Arbitrary uploads do</text><text x="411" y="154" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F8F8F3" font-weight="400" >not establish signal</text><text x="411" y="188" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F8F8F3" font-weight="400" >jumping. Fixed camera</text><text x="411" y="222" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F8F8F3" font-weight="400" >regions and a stop line</text><text x="411" y="256" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F8F8F3" font-weight="400" >are required.</text><rect x="754" y="12" width="340" height="290" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(774 35) scale(0.9090909090909091)"><path d="M3 22q19-27 38 0q-19 27-38 0M22 16a6 6 0 1 0 0 12a6 6 0 1 0 0-12" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="831" y="62" font-family="Bahnschrift, Arial, sans-serif" font-size="18" fill="#F3D962" font-weight="600" >REVIEW REQUIRED</text><text x="776" y="120" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F8F8F3" font-weight="400" >Model outputs are</text><text x="776" y="154" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F8F8F3" font-weight="400" >suggestions, not</text><text x="776" y="188" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F8F8F3" font-weight="400" >verified ground truth</text><text x="776" y="222" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F8F8F3" font-weight="400" >or automatic fines.</text></svg>