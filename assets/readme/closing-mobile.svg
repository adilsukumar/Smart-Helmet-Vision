<svg xmlns="http://www.w3.org/2000/svg" width="640" height="650" viewBox="0 0 640 650" role="img" aria-labelledby="t d"><title id="t">Smart Helmet Vision. Observe carefully. Review responsibly. Computer vision is a starting point; evidence still needs a person. Research demo, not a finished enforcement system.</title><desc id="d">Smart Helmet Vision. Observe carefully. Review responsibly. Computer vision is a starting point; evidence still needs a person. Research demo, not a finished enforcement system. Concept artwork, not a detector screenshot, confidence measurement or evidence of a real violation.</desc><defs><linearGradient id="foil"><stop stop-color="#F8F8F3"/><stop offset=".55" stop-color="#BCFCF6"/><stop offset="1" stop-color="#A783F7"/></linearGradient></defs><style>@keyframes focus{50%{opacity:.35}}@keyframes visor{50%{stroke:#FF4081}}@keyframes float{50%{transform:translateY(-5px)}}.focus{animation:focus 5s ease-in-out infinite}.visor{animation:visor 8s ease-in-out infinite}.float{animation:float 9s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.focus,.visor,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><text x="32" y="54" font-family="Bahnschrift, Arial, sans-serif" font-size="22" fill="#FF4081" font-weight="600" >SMART HELMET VISION / ADIL SUKUMAR</text><text x="30" y="155" font-family="Bahnschrift, Arial, sans-serif" font-size="52" fill="#F8F8F3" font-weight="700" letter-spacing="-1.5">Observe carefully.</text><text x="30" y="230" font-family="Bahnschrift, Arial, sans-serif" font-size="48" fill="#BCFCF6" font-weight="700" letter-spacing="-1.5">Review responsibly.</text><text x="32" y="296" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#A783F7" font-weight="400" >Computer vision is a starting point.</text><text x="32" y="330" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#A783F7" font-weight="400" >Evidence still needs a person.</text><g transform="translate(478 450) scale(0.75)"><g class="float"><path d="M-102 35v-52a104 104 0 0 1 208 0v62H34L-6 98H-77V35z" fill="none" stroke="#BCFCF6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M-83 -28q37-84 116-69M-60 -49q31-37 74-35" fill="none" stroke="#A783F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M18 -47h87M18 -47q-12 49 16 92M-53 65h26" fill="none" stroke="#FF4081" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="visor"/><path d="M-145 -120h32M-145 -120v32M145 -120h-32M145 -120v32M-145 125h32M-145 125v-32M145 125h-32M145 125v-32" fill="none" stroke="#A783F7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="focus"/><circle cx="79" cy="65" r="6" fill="#F3D962"/></g></g><text x="32" y="584" font-family="Bahnschrift, Arial, sans-serif" font-size="24" fill="#F3D962" font-weight="600" >Explore the models. Inspect the rules.</text><text x="32" y="630" font-family="Bahnschrift, Arial, sans-serif" font-size="22" fill="#FF4081" font-weight="400" >Research demo / camera validation still ahead</text></svg>