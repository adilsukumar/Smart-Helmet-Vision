<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="t d"><title id="t">Browser: local ONNX traffic and helmet detection. Python: input, tracking, rider association, calibrated signal rules, event confirmation and saved evidence. They are distinct paths.</title><desc id="d">Browser: local ONNX traffic and helmet detection. Python: input, tracking, rider association, calibrated signal rules, event confirmation and saved evidence. They are distinct paths. Concept artwork, not a detector screenshot, confidence measurement or evidence of a real violation.</desc><defs><linearGradient id="foil"><stop stop-color="#F8F8F3"/><stop offset=".55" stop-color="#BCFCF6"/><stop offset="1" stop-color="#A783F7"/></linearGradient></defs><style>@keyframes focus{50%{opacity:.35}}@keyframes visor{50%{stroke:#FF4081}}@keyframes float{50%{transform:translateY(-5px)}}.focus{animation:focus 5s ease-in-out infinite}.visor{animation:visor 8s ease-in-out infinite}.float{animation:float 9s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.focus,.visor,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="522" height="295" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 35) scale(0.9545454545454546)"><path d="M4 6h36v34H4zM4 15h36M10 10h1M16 10h1M22 10h1" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="64" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#F3D962" font-weight="600" >IN THE BROWSER</text><text x="46" y="116" font-family="Bahnschrift, Arial, sans-serif" font-size="22" fill="#FF4081" font-weight="600" >YOLO11 + YOLOv8n / ONNX</text><text x="46" y="165" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Select a local video. Run traffic</text><text x="46" y="199" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >and helmet models, draw confirmed</text><text x="46" y="233" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >results, and keep the selected file</text><text x="46" y="267" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >on the device.</text><rect x="574" y="12" width="522" height="295" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(594 35) scale(0.9545454545454546)"><path d="M14 10L3 22l11 12M30 10l11 12-11 12M26 5l-8 34" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="654" y="64" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#F3D962" font-weight="600" >IN THE PYTHON FOLDER</text><text x="596" y="116" font-family="Bahnschrift, Arial, sans-serif" font-size="22" fill="#FF4081" font-weight="600" >TRACKING + RULES + EVIDENCE</text><text x="596" y="165" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Video input, rider-to-bike</text><text x="596" y="199" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >association, stop-line crossing,</text><text x="596" y="233" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >event confirmation and saved</text><text x="596" y="267" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >evidence. Includes a controlled</text><text x="596" y="301" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >simulation.</text></svg>